name: Publish Experiment Report

on:
  push:
    branches: [experiment/perceptual-hash-matching]
    paths:
      - 'Report/**'
      - 'scripts/build_experiment_pages.py'
      - '.github/workflows/experiment-report-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: experiment-report-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build Report Site
        run: python3 scripts/build_experiment_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Report
        id: deployment
        uses: actions/deploy-pages@v4
